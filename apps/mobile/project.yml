name: ChinaTextbookStudy
options:
  bundleIdPrefix: com.wuwangzhang1216
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "聪聪学堂"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.education"
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_NSHumanReadableCopyright: "本应用内所含教材内容版权归人民教育出版社等原出版方所有。客户端代码采用 MIT 许可开源。"
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "跟读课文需要使用麦克风，录下你的朗读。录音只保存在这台设备上，退出跟读后会自动删除，不会上传。"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  ChinaTextbookStudy:
    type: application
    platform: iOS
    sources:
      - path: ChinaTextbookStudy
    resources:
      - path: ChinaTextbookStudy/Resources/seed-index.json
      - path: ChinaTextbookStudy/Resources/seed-data.zip
      - path: ChinaTextbookStudy/Resources/PrivacyInfo.xcprivacy
      - path: ChinaTextbookStudy/Resources/privacy-policy.json
      - path: ChinaTextbookStudy/Resources/Assets.xcassets
    entitlements:
      path: ChinaTextbookStudy/ChinaTextbookStudy.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wuwangzhang1216.congcongschool
        # 换机存档恢复走 NSUbiquitousKeyValueStore；没有这条 entitlement 时
        # KVS 只在本机落盘、不与 iCloud 同步，云备份会静默空转。
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    dependencies:
      - package: ZIPFoundation
      - target: ChinaTextbookStudyWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wuwangzhang1216.congcongschool
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ChinaTextbookStudyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ChinaTextbookStudyWidget
        excludes:
          - "Info.plist"
          - "*.entitlements"
    entitlements:
      path: ChinaTextbookStudyWidget/ChinaTextbookStudyWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wuwangzhang1216.congcongschool
    info:
      path: ChinaTextbookStudyWidget/Info.plist
      properties:
        CFBundleDisplayName: 聪聪学堂
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wuwangzhang1216.congcongschool.widget
        SKIP_INSTALL: YES
  ChinaTextbookStudyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChinaTextbookStudyTests
    dependencies:
      - target: ChinaTextbookStudy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wuwangzhang1216.congcongschool.tests
  ChinaTextbookStudyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ChinaTextbookStudyUITests
    dependencies:
      - target: ChinaTextbookStudy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wuwangzhang1216.congcongschool.uitests
schemes:
  ChinaTextbookStudy:
    build:
      targets:
        ChinaTextbookStudy: all
        ChinaTextbookStudyTests: [test]
        ChinaTextbookStudyUITests: [test]
    test:
      targets:
        - ChinaTextbookStudyTests
        - ChinaTextbookStudyUITests
