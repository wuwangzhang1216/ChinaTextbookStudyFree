name: Web UX regressions

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - 'output/**'
      - 'scripts/checks/**'
      - 'scripts/quiz/**'
      - 'scripts/editions/**'
      - 'scripts/tts/**'
      - 'docs/ux-content-corrections.json'
      - 'package*.json'
      - '.github/workflows/web-ux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run type-check
      - name: Pinyin collector and Edge provider contract
        run: |
          python3 -m pip install edge-tts==7.3.1
          python3 -m unittest discover -s scripts/tts -p 'test_*pinyin*.py'
          python3 -m unittest discover -s scripts/tts -p 'test_edge_tts_batch.py'
      - name: Learning state, rewards and media transport regressions
        run: |
          npx tsx scripts/checks/lesson-resume.ts
          npx tsx --tsconfig scripts/checks/tsconfig.json scripts/checks/lesson-time.tsx
          npx tsx scripts/checks/review-recovery.ts
          npx tsx scripts/checks/review-content.ts
          npx tsx scripts/checks/review-preparation.ts
          npx tsx scripts/checks/review-session.ts
          npx tsx scripts/checks/learner-profiles.ts
          npx tsx --tsconfig scripts/checks/tsconfig.json scripts/checks/lesson-boundary.tsx
          npx tsx scripts/checks/question-drafts.ts
          npx tsx scripts/checks/content-math.ts
          npx tsx scripts/checks/math-speech.ts
          python scripts/checks/textbook-editions.py
          python scripts/checks/five-four-import.py
          npx tsx --tsconfig apps/web/tsconfig.json scripts/checks/ux-rewards.ts
          npx tsx scripts/checks/intro-narration.ts
          npx tsx scripts/checks/tts-legacy-audio.ts
          node scripts/checks/service-worker.mjs
