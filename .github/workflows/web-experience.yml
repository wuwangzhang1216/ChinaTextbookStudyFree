name: Web experience checks
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - 'scripts/checks/**'
      - 'output/**/quizzes/**'
      - 'output/**/outlines/**'
      - 'release/content-baseline-v1.4.0.json'
      - 'package*.json'
      - '.github/workflows/web-experience.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experience:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run type-check
      - run: npm run check:web-experience
      - run: npm run check:visual-controls
      - name: Release installer and platform grouping
        run: |
          python3 scripts/checks/release-installer.py
          python3 scripts/checks/release-v2.py
          python3 scripts/checks/release-organization.py
          npx tsx scripts/checks/narration-reference.test.ts
      - name: Learning quality and canonical pilot content
        run: |
          python3 scripts/install-release.py --asset-kind source-data
          npx tsx apps/web/scripts/build-data.ts
          python3 scripts/checks/content-retention.py
          npx tsx scripts/checks/content-grading.ts
          python3 scripts/checks/revised-math-arithmetic.py
          python3 scripts/checks/ux-content-arithmetic.py
          python3 scripts/checks/five-four-arithmetic.py
          npx tsx scripts/check-lesson-revisions.ts --content-only
          npx tsx scripts/checks/ux-content.ts --allow-missing-audio
          npx tsx scripts/checks/pinyin-speech.ts
          npm run check:learning-quality
      - name: Narration and offline transport
        run: |
          npx tsx scripts/checks/intro-narration.ts
          npx tsx scripts/checks/tts-legacy-audio.ts
          node scripts/checks/service-worker.mjs
          npx tsx scripts/checks/math-speech.ts
